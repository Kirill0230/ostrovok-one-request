# Инфраструктура для разработки: docker compose up -d
# Порты 5544 (Postgres) и 6380 (Redis) выбраны, чтобы не конфликтовать с локальными на 5432/6379.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: odin
      POSTGRES_PASSWORD: odin
      POSTGRES_DB: odin
    ports:
      - "5544:5432"
    volumes:
      - odin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odin -d odin"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # только счётчики лимитов — на диск не пишем
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

volumes:
  odin_pg:
