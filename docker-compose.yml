# Postgres для разработки: docker compose up -d db
# Порт 5544 выбран, чтобы не конфликтовать с локальным Postgres на 5432.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: odin
      POSTGRES_PASSWORD: odin
      POSTGRES_DB: odin
    ports:
      - "5544:5432"
    volumes:
      - odin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odin -d odin"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  odin_pg:
